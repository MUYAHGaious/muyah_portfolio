# Cache zone backing the `proxy_cache muyah_cache` directive in muyah.dev.conf.
#
# Install:
#   sudo cp deploy/nginx/muyah-cache.conf /etc/nginx/conf.d/muyah-cache.conf
#   sudo mkdir -p /var/cache/nginx/muyah && sudo chown www-data: /var/cache/nginx/muyah
#   sudo nginx -t && sudo systemctl reload nginx
#
# This MUST be installed before the site file. `proxy_cache_path` is only valid
# in the http context, which a file in sites-available cannot open, so it lives
# in conf.d — and a vhost naming a zone that does not exist fails `nginx -t`
# with "proxy_cache zone not found", which blocks the reload for every site.
#
#   levels=1:2      two-level directory fan-out, so one directory never holds
#                   hundreds of thousands of entries
#   keys_zone       10m of shared memory holds roughly 80k keys — far more than
#                   this site has pages
#   max_size        ceiling on disk. The box has room; this is a safety rail
#   inactive=60m    entries untouched for an hour are evicted even if still
#                   "valid", so a deleted page cannot linger
#   use_temp_path=off  writes straight into the cache dir instead of copying
#                   across filesystems

proxy_cache_path /var/cache/nginx/muyah
                 levels=1:2
                 keys_zone=muyah_cache:10m
                 max_size=256m
                 inactive=60m
                 use_temp_path=off;

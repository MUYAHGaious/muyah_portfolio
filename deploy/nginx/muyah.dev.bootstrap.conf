# Temporary port-80-only vhost, used once to obtain the first certificate.
#
# The full site file (muyah.dev.conf) names certificate paths under
# /etc/letsencrypt/live/muyah.dev/. Until certbot has issued that certificate
# those files do not exist, and `nginx -t` fails — so the full file cannot be
# installed first. But certbot's webroot challenge needs nginx to already serve
# /.well-known/acme-challenge/ for this hostname, and without a vhost for
# muyah.dev the request falls through to the default server and 404s.
#
# This file breaks the cycle: install it, reload, obtain the certificate, then
# replace it with muyah.dev.conf and reload again.

server {
    listen 80;
    listen [::]:80;
    server_name muyah.dev www.muyah.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Anything else during this window is a holding response rather than a
    # redirect to https, which would not resolve yet.
    location / {
        return 503 "muyah.dev is being set up.\n";
        add_header Content-Type text/plain always;
    }
}

# nginx site for muyah.dev on the shared VPS.
#
# Install:
#   sudo cp deploy/nginx/muyah.dev.conf /etc/nginx/sites-available/muyah.dev
#   sudo ln -sf /etc/nginx/sites-available/muyah.dev /etc/nginx/sites-enabled/muyah.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# Written to match the conventions already used by the other sites on this box:
# a port-80 server that answers the ACME challenge and redirects everything else,
# and a port-443 server that proxies to loopback ports.

server {
    listen 80;
    listen [::]:80;
    server_name muyah.dev www.muyah.dev;

    # certbot writes its challenge files here; this must stay reachable over
    # plain HTTP or renewal fails silently in ninety days.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /                            { return 301 https://$host$request_uri; }
}

server {
    # This box runs nginx 1.24, where HTTP/2 is a parameter of `listen`.
    # The `http2 on;` directive is nginx 1.25+ only and fails `nginx -t` here
    # with "unknown directive", which blocks the reload.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muyah.dev www.muyah.dev;

    ssl_certificate     /etc/letsencrypt/live/muyah.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muyah.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # One canonical hostname. Matches the redirect the standalone Caddyfile does.
    if ($host = www.muyah.dev) {
        return 301 https://muyah.dev$request_uri;
    }

    # The API caps uploads at 5 MB; this leaves room for multipart overhead
    # without letting a large body tie up a worker.
    client_max_body_size 10M;

    # .dev is on the HSTS preload list, so browsers already refuse plain HTTP
    # here. The header keeps that true for anything that reaches nginx directly.
    #
    # CAREFUL: add_header does not merge. A location block that declares any
    # add_header of its own discards every one inherited from here, silently.
    # That dropped HSTS from live responses until it was caught — so the
    # locations below that set their own headers repeat this one explicitly.
    # Nothing else is repeated: the app already sends nosniff, X-Frame-Options,
    # Referrer-Policy and Permissions-Policy on its own responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploaded images are served straight off disk — they never touch Python or
    # Node. The trailing slashes on both the location and the alias matter:
    # /uploads/a.webp maps to <root>/uploads/a.webp.
    location /uploads/ {
        alias /home/angwe/sites/muyah.dev/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repeated because the line above discards the inherited headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # uvicorn runs with --proxy-headers, so this is what makes the app emit
        # https:// URLs and mark the session cookie Secure. Without it, login
        # silently fails to persist.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The admin panel is per-session and must never be cached — a stored response
    # here could serve one person's authenticated view to somebody else. Declared
    # before `location /` so it wins, and it inherits no cache settings.
    location /admin {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;

        # ── stale-if-error ───────────────────────────────────────────────────
        # The point of this block: when the app or the API is unreachable, serve
        # the last known-good copy of the page instead of an error. A portfolio
        # changes weekly, so a few-minutes-old copy is indistinguishable from
        # live — and far better than a visitor seeing a failure.
        proxy_cache muyah_cache;
        proxy_cache_valid 200 301 302 60s;
        proxy_cache_valid 404 10s;

        # Serve stale on every kind of upstream failure. `updating` additionally
        # lets one request refresh in the background while everyone else keeps
        # getting the cached copy, instead of all of them queueing on the origin.
        proxy_cache_use_stale error timeout invalid_header updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # Only one request populates a given entry; the rest wait briefly rather
        # than stampeding the app when a popular page expires.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Pages render per request, so Next sends `Cache-Control: no-store`.
        # Without ignoring it nothing would ever be cached and there would be no
        # known-good copy to fall back on. `proxy_cache_valid` above is what
        # decides freshness instead.
        proxy_ignore_headers Cache-Control Expires;

        # Safety rail for the above: never store a response that sets a cookie,
        # and never serve a cached response to a request that carries one. The
        # public site is deliberately cookieless, so this costs nothing here and
        # prevents a session-bearing response from ever entering a shared cache.
        # $upstream_http_* reads the response from the app; $http_* would read the
        # request, where Set-Cookie never appears, and the rule would do nothing.
        proxy_no_cache $upstream_http_set_cookie $http_authorization;
        proxy_cache_bypass $http_cookie $http_authorization;

        # HIT / MISS / STALE / UPDATING — the quickest way to confirm the cache
        # is behaving, and to prove a fallback actually happened during an outage.
        add_header X-Cache-Status $upstream_cache_status always;
        # Repeated because the line above discards the inherited headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

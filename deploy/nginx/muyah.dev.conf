# nginx site for muyah.dev on the shared VPS.
#
# Install:
#   sudo cp deploy/nginx/muyah.dev.conf /etc/nginx/sites-available/muyah.dev
#   sudo ln -sf /etc/nginx/sites-available/muyah.dev /etc/nginx/sites-enabled/muyah.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# Written to match the conventions already used by the other sites on this box:
# a port-80 server that answers the ACME challenge and redirects everything else,
# and a port-443 server that proxies to loopback ports.

server {
    listen 80;
    listen [::]:80;
    server_name muyah.dev www.muyah.dev;

    # certbot writes its challenge files here; this must stay reachable over
    # plain HTTP or renewal fails silently in ninety days.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /                            { return 301 https://$host$request_uri; }
}

server {
    # This box runs nginx 1.24, where HTTP/2 is a parameter of `listen`.
    # The `http2 on;` directive is nginx 1.25+ only and fails `nginx -t` here
    # with "unknown directive", which blocks the reload.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name muyah.dev www.muyah.dev;

    ssl_certificate     /etc/letsencrypt/live/muyah.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muyah.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # One canonical hostname. Matches the redirect the standalone Caddyfile does.
    if ($host = www.muyah.dev) {
        return 301 https://muyah.dev$request_uri;
    }

    # The API caps uploads at 5 MB; this leaves room for multipart overhead
    # without letting a large body tie up a worker.
    client_max_body_size 10M;

    # .dev is on the HSTS preload list, so browsers already refuse plain HTTP
    # here. The header keeps that true for anything that reaches nginx directly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploaded images are served straight off disk — they never touch Python or
    # Node. The trailing slashes on both the location and the alias matter:
    # /uploads/a.webp maps to <root>/uploads/a.webp.
    location /uploads/ {
        alias /home/angwe/sites/muyah.dev/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # uvicorn runs with --proxy-headers, so this is what makes the app emit
        # https:// URLs and mark the session cookie Secure. Without it, login
        # silently fails to persist.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
